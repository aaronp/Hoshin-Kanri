<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X-Matrix summary</title>
<style>
  :root { --fg: #16181D; --muted: #555C68; --line: #E2E5EA; --bg: #fff; --soft: #F6F7F9; --ac: #3346D3; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e6edf3; --muted: #9198a1; --line: #30363d; --bg: #0d1117; --soft: #161b22; --ac: #7c8cf0; } }
  body { font: 14px/1.5 Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; margin: 0; color: var(--fg); background: var(--bg); }
  main { max-width: 600px; margin: 0 auto; padding: 28px 16px; display: grid; gap: 18px; }
  h1 { font-size: 18px; margin: 0; }
  h1 a { color: inherit; text-decoration: none; }
  h1 a:hover { color: var(--ac); text-decoration: underline; }
  fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin: 0; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
  legend { color: var(--muted); font-size: 12px; padding: 0 4px; }
  select { font: inherit; padding: 4px 6px; max-width: 100%; }
  #img { min-height: 40px; overflow-x: auto; }
  #img img { display: block; max-width: none; }
  .note { color: var(--muted); font-size: 13px; margin: 0; }
  .err { color: #b42318; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  button, .btn { font: inherit; font-size: 13px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); color: var(--fg); cursor: pointer; text-decoration: none; }
  button:disabled { opacity: .45; cursor: default; }
  a { color: var(--ac); }
</style>
<main>
  <h1><a id="title" title="Open the full X-Matrix">X-Matrix summary</a></h1>
  <fieldset>
    <legend>Image</legend>
    <label><input type="radio" name="type" value="badge"> Badge</label>
    <label><input type="radio" name="type" value="summary"> Summary card</label>
    <label>Show
      <select id="show"><option value="item">Last change (category : item)</option><option value="crumb">Breadcrumb to the last change</option><option value="last">Section of the last change</option></select>
    </label>
  </fieldset>
  <div id="img">Loading…</div>
  <p class="note" id="note"></p>
  <div class="row">
    <button id="copyMd">Copy README markdown</button>
    <a class="btn" id="save">Download SVG</a>
  </div>
</main>
<script>
  // summary.html?src=<markdown url>&type=summary|badge&show=item|crumb|last|<section slug>
  // Renders from the markdown alone, using its "> Last updated" line. With
  // &draft (from the viewer's badge button) it previews the unsaved edits the
  // viewer left in localStorage. The title links back to the full X-Matrix:
  // the saved file (src), else a #md= snapshot of what's previewed.
  const $ = (id) => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const src = q.get('src');
  const absSrc = src && new URL(src, location.href).href;
  let matrixUrl = new URL('Main.dc.html' + (src ? '?src=' + encodeURIComponent(absSrc) : ''), location.href).href;
  let draft = null;
  if (q.has('draft')) { try { draft = localStorage.getItem('xm-draft'); } catch (e) { /* fall back to src */ } }
  let C, model, svgUrl;

  const opts = () => ({ type: document.querySelector('[name=type]:checked').value, show: $('show').value });

  // Settings live in the URL, so a reload keeps them.
  function pageUrl() {
    const o = opts();
    const u = new URL(location.pathname, location.href);
    if (src) u.searchParams.set('src', src);
    u.searchParams.set('type', o.type);
    u.searchParams.set('show', o.show);
    return u.href;
  }

  function render() {
    const o = opts();
    // On the card the last change is always shown as a breadcrumb.
    const itemOpt = $('show').options[0];
    itemOpt.hidden = itemOpt.disabled = o.type === 'summary';
    if (o.type === 'summary' && o.show === 'item') { $('show').value = 'crumb'; o.show = 'crumb'; }
    const svg = o.type === 'badge' ? C.badgeSvg(model, o.show) : C.summarySvg(model, o.show);
    if (svgUrl) URL.revokeObjectURL(svgUrl);
    svgUrl = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
    $('img').innerHTML = '';
    $('img').appendChild(Object.assign(document.createElement('img'), { src: svgUrl, alt: model.title }));
    Object.assign($('save'), { href: svgUrl, download: o.type + '.svg' });
    const u = new URL(pageUrl());
    if (draft !== null) u.searchParams.set('draft', '1');
    history.replaceState(null, '', u);
  }

  function copy(btn, text) {
    const was = btn.textContent;
    C.copyText(text).then(() => { btn.textContent = 'Copied ✓'; }, () => { btn.textContent = 'Copy failed'; }).then(() => setTimeout(() => { btn.textContent = was; }, 1600));
  }

  const fetchText = (url) => fetch(url).then((r) => { if (!r.ok) throw new Error(url + ': HTTP ' + r.status); return r.text(); });

  Promise.all([fetchText('Main.dc.html'), draft !== null ? draft : src ? fetchText(absSrc) : Promise.reject(new Error('no ?src= given, and no unsaved edits to preview. Open this from the X-Matrix title bar.'))])
    .then(([html, md]) => {
      // The parser and renderer live in the viewer's component; reuse them.
      const js = /<script[^>]*data-dc-script[^>]*>([\s\S]*?)<\/script>/.exec(html)[1];
      C = new Function('DCLogic', js + '\nreturn Component;')(class {});
      const r = C.parseMd(md);
      if (!r.ok) throw new Error('line ' + r.error.line + ': ' + r.error.message);
      model = r.model;
      $('title').textContent = model.title;
      model.sections.forEach((s) => $('show').appendChild(new Option('Section: ' + s.title, C.secSlug(s))));
      document.querySelector('[name=type][value=' + (q.get('type') === 'summary' ? 'summary' : 'badge') + ']').checked = true;
      const type = q.get('type') === 'summary' ? 'summary' : 'badge';
      $('show').value = q.get('show') || (type === 'badge' ? 'item' : 'crumb');
      if ($('show').selectedIndex < 0) $('show').value = 'crumb';
      $('title').href = matrixUrl;
      // Unsaved edits with no file behind them: link back to a snapshot of them.
      if (draft !== null && !src) C.packMd(md).then((p) => { matrixUrl = new URL('Main.dc.html#md=' + p, location.href).href; $('title').href = matrixUrl; });
      $('note').textContent = (draft !== null ? 'Previewing your unsaved edits' + (src ? ': Download and save the markdown back to ' + src + ' for the published images to show them. ' : '. ') : '') +
        'README images must be real files: commit the downloaded SVG next to the markdown, or have your Pages workflow run summary.js.';
      document.querySelectorAll('[name=type]').forEach((el) => el.addEventListener('change', render));
      $('show').addEventListener('change', render);
      // Read at click time: matrixUrl may still be swapping to a snapshot link.
      $('copyMd').addEventListener('click', (e) => copy(e.target, '[![' + model.title + '](' + opts().type + '.svg)](' + matrixUrl + ')'));
      render();
    })
    .catch((e) => { $('img').textContent = 'Could not render: ' + e.message; $('img').className = 'err'; });
</script>
